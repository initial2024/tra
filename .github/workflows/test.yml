name: Sandbox Manager - source tests
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test dependency-free core
        run: npm test
      - name: Syntax verify
        run: |
          node --check src/state.mjs
          node --check lib/index.js
          node --check web/app.js
          node --check scripts/serve.mjs
      - name: Build DSH compatibility tool (not installable APK)
        run: python3 scripts/build_plugin.py
      - name: Verify direct-install DSH TGZ package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tra-pack
          FILE="$(npm pack --pack-destination /tmp/tra-pack --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)[0].filename))")"
          test "$FILE" = "dsh-sandbox-manager-0.2.1.tgz"
          tar -tzf "/tmp/tra-pack/$FILE" | sort | tee /tmp/tra-pack.list
          for item in package/package.json package/index.js package/cordis.patch.yml package/README.md package/LICENSE; do
            grep -Fxq "$item" /tmp/tra-pack.list
          done
          test "$(wc -l < /tmp/tra-pack.list)" -eq 5
      - name: Build mobile offline single-file UI
        run: |
          python3 scripts/build_offline_ui.py
          python3 -m unittest discover -s tests -p "test_offline.py"
      - name: Check package archive entries
        run: python3 -c "import zipfile; z=zipfile.ZipFile('dist/sandbox-manager-tool.zip'); assert set(z.namelist()) == {'package.json','lib/index.js'}"
      - name: Upload read-only tool ZIP (optional)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tra-sandbox-manager-tool
          path: dist/sandbox-manager-tool.zip
          retention-days: 7

      - name: Upload mobile offline interface (optional)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tra-sandbox-manager-mobile-offline
          path: dist/tra-sandbox-manager-offline.html
          retention-days: 14
